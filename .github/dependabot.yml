version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # New releases get two weeks to settle before they are proposed.
    cooldown:
      default-days: 14
    ignore:
      # svelte-check only accepts TypeScript 5 and 6 so far.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node types follow the oldest supported Node, not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
      runtime:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
