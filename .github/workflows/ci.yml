name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Normally about a minute; when the runner cannot reach Ubuntu's mirrors it would hang for hours.
      - run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - run: npm run test:e2e
      # Node 22 cannot build a single executable; it still builds the portable zip.
      - if: matrix.node == 22
        run: npm run release -- --no-single
      - if: matrix.node == 26
        run: npm run release
      - name: Browser tests against the single executable
        if: matrix.node == 26
        run: npm run test:e2e
        env:
          CHATLEDGER_BINARY: ${{ runner.os == 'Windows' && format('{0}\build\sea\chatledger.exe', github.workspace) || format('{0}/build/sea/chatledger', github.workspace) }}
