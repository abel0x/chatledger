name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
      - run: npx playwright install --with-deps chromium firefox
      - name: Browser tests against the single executable
        run: npm run test:e2e
        env:
          CHATLEDGER_BINARY: ${{ runner.os == 'Windows' && format('{0}\build\sea\chatledger.exe', github.workspace) || format('{0}/build/sea/chatledger', github.workspace) }}
      # Linux also builds the portable zip that runs anywhere with Node.js; it is published once.
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: ${{ runner.os == 'Windows' && 'release/*-windows-*.zip' || 'release/*.zip' }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Write release notes
        run: node scripts/notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt
          --title "chatledger ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
