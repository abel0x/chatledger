name: Release

on:
  push:
    tags: ['v*']
  # GitHub starts no workflow when more than three tags are pushed at once; this runs one by hand.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.5.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.kind.outputs.systems }}
      single: ${{ steps.kind.outputs.single }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # Versions before 0.4.0 have no single program, so they only build on Linux.
      - id: kind
        run: |
          if [ -f scripts/single.mjs ]; then
            echo 'systems=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo 'single=true' >> "$GITHUB_OUTPUT"
          else
            echo 'systems=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'single=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: prepare
    strategy:
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
      - if: needs.prepare.outputs.single == 'true'
        run: npx playwright install --with-deps chromium firefox
        timeout-minutes: 10
      - name: Browser tests against the single executable
        if: needs.prepare.outputs.single == 'true'
        run: npm run test:e2e
        env:
          CHATLEDGER_BINARY: ${{ runner.os == 'Windows' && format('{0}\build\sea\chatledger.exe', github.workspace) || format('{0}/build/sea/chatledger', github.workspace) }}
      # Linux also builds the portable zip that runs anywhere with Node.js; it is published once.
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: ${{ runner.os == 'Windows' && 'release/*-windows-*.zip' || 'release/*.zip' }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Write release notes
        run: node scripts/notes.mjs "$TAG" > release-notes.md
      - name: Checksums
        working-directory: release
        run: sha256sum *.zip > SHA256SUMS.txt
      # Only the highest version is marked latest, whatever order releases finish in.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          top=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          latest=$([ "$TAG" = "$top" ] && echo true || echo false)
          gh release create "$TAG" release/*.zip release/SHA256SUMS.txt \
            --title "chatledger ${TAG#v}" --notes-file release-notes.md --verify-tag --latest="$latest"
